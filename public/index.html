<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050302" />
    <meta name="description" content="Five AI sharks, one AI founder, every offer negotiated on air. A 3D Shark Tank simulator." />
    <title>AI Shark Tank</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050302'/%3E%3Cpath d='M12 50 C22 36 32 16 52 10 C45 24 43 36 47 50 Z' fill='%2339e0c8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-view="lobby">
    <main class="broadcast">
      <div class="stage" id="stage" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>

      <span class="sr-only" id="timecode" aria-hidden="true">00:00:00</span>

      <section class="title-screen" id="lobby" aria-labelledby="show-title">
        <div class="title-card">
          <p class="eyebrow">Inside the studio</p>
          <h1 id="show-title"><b>AI</b> Shark Tank</h1>
          <p class="title-tagline">The models pitch. The sharks decide. You watch.</p>

          <div class="start-modes" aria-label="Start a show">
            <button class="mode-button mode-api" type="button" id="api-button" aria-label="API" aria-describedby="api-description" disabled>
              <strong>API</strong><span id="api-description">A new idea. A live AI cast.</span>
            </button>
            <button class="mode-button mode-test" type="button" id="test-button" aria-label="Test" aria-describedby="test-description" disabled>
              <strong>Test</strong><span id="test-description">Scripted show. No API calls.</span>
            </button>
          </div>
          <p class="start-status" id="start-status" role="status" aria-live="polite">Preparing the studio…</p>
          <section class="cast-roster" aria-labelledby="cast-heading">
            <h2 id="cast-heading">The API cast</h2>
            <dl id="cast-models"></dl>
            <p class="cast-note">They invent the idea, build the deck, and make the deal.</p>
          </section>
          <p class="production-note" id="production-note">AI portrayals and synthetic voices. No real statements or endorsements.</p>
          <p class="form-error" id="lobby-error" role="alert" hidden></p>
        </div>
      </section>

      <div class="lower-third" id="lower-third" aria-hidden="true">
        <span class="lt-kicker" id="lt-kicker"></span>
        <strong class="lt-title" id="lt-title"></strong>
      </div>

      <div class="subtitles" id="caption" aria-hidden="true">
        <span class="sub-name" id="sub-name"></span>
        <p class="sub-text" id="sub-text"></p>
      </div>

      <div class="player" id="transport" aria-label="Playback controls">
        <button type="button" data-action="restart" aria-label="Restart episode" title="Restart (R)"></button>
        <button type="button" class="player-main" data-action="toggle" aria-label="Pause" title="Play / pause (Space)"></button>
        <button type="button" data-action="next" aria-label="Next line" title="Next line (→)"></button>
        <button type="button" data-action="finish" aria-label="Skip to verdict" title="Skip to verdict (Shift + →)"></button>
        <div class="player-progress" id="progress" role="progressbar" aria-label="Episode progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <i id="progress-fill"></i>
        </div>
        <div class="player-speed" id="speed" role="group" aria-label="Playback speed"></div>
        <button type="button" data-action="voice" aria-pressed="false" aria-label="Turn voices on" title="Browser voices" hidden></button>
        <button type="button" data-action="captions" aria-label="Show captions" aria-pressed="false" title="Captions (C)">CC</button>
        <button type="button" data-action="graphics" aria-label="Show offer graphics" aria-pressed="false" title="Offer graphics">Info</button>
        <button type="button" data-action="exit" aria-label="Lobby" title="Back to the lobby"></button>
      </div>
    </main>

    <dialog class="end-card" id="verdict" aria-labelledby="verdict-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <p class="sr-only" id="announcer" aria-live="polite"></p>
    <ol class="sr-only" id="transcript" aria-label="Transcript"></ol>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
