<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050302" />
    <meta name="description" content="Five AI sharks, one AI founder, every offer negotiated on air. A 3D Shark Tank simulator." />
    <title>AI Shark Tank</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050302'/%3E%3Cpath d='M12 50 C22 36 32 16 52 10 C45 24 43 36 47 50 Z' fill='%2339e0c8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-view="lobby">
    <main class="broadcast">
      <div class="stage" id="stage" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>

      <div class="bug" aria-hidden="true">
        <svg viewBox="0 0 64 48"><path d="M4 44 C14 30 26 10 52 4 C44 18 42 30 46 44 Z" /></svg>
        <span><b>AI</b> Shark Tank</span>
      </div>
      <div class="onair" aria-hidden="true">
        <span class="onair-dot"></span><span>Live</span><span class="timecode" id="timecode">00:00:00</span>
      </div>

      <section class="title-screen" id="lobby" aria-labelledby="show-title">
        <div class="title-card">
          <p class="eyebrow"><span class="onair-dot"></span>Tonight in the tank</p>
          <h1 id="show-title"><b>AI</b> Shark Tank</h1>
          <p class="title-tagline">Five AI sharks. One AI founder. Every offer negotiated on air.</p>

          <div class="lineup" id="pitch-list" role="radiogroup" aria-label="Choose tonight's founder"></div>

          <div class="tonight" id="tonight">
            <strong id="tonight-title"></strong>
            <span id="tonight-detail"></span>
          </div>

          <details class="own-idea" id="own-idea">
            <summary>Pitch your own idea</summary>
            <div class="idea-field">
              <label class="sr-only" for="idea-input">Your startup idea</label>
              <textarea id="idea-input" rows="2" maxlength="140" placeholder="A subscription box of snacks for houseplants" autocomplete="off"></textarea>
              <span class="char-count" id="char-count">0/140</span>
            </div>
          </details>

          <div class="title-actions">
            <button class="enter" type="button" id="roll-button">Enter the tank</button>
            <label class="seed" for="seed-input" title="Same pitch and seed always replay the same episode.">
              <span>Seed</span>
              <input id="seed-input" type="number" inputmode="numeric" min="1" max="999999" step="1" value="1" />
              <button type="button" id="seed-dice" aria-label="Pick a random seed"></button>
            </label>
          </div>
          <p class="form-error" id="lobby-error" role="alert" hidden></p>
        </div>
      </section>

      <div class="lower-third" id="lower-third" aria-hidden="true">
        <span class="lt-kicker" id="lt-kicker"></span>
        <strong class="lt-title" id="lt-title"></strong>
      </div>

      <div class="subtitles" id="caption" aria-hidden="true">
        <span class="sub-name" id="sub-name"></span>
        <p class="sub-text" id="sub-text"></p>
      </div>

      <div class="stamp" id="stamp" aria-hidden="true"><span id="stamp-label">Deal</span></div>
      <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

      <div class="player" id="transport" aria-label="Playback controls">
        <button type="button" data-action="restart" aria-label="Restart episode" title="Restart (R)"></button>
        <button type="button" class="player-main" data-action="toggle" aria-label="Pause" title="Play / pause (Space)"></button>
        <button type="button" data-action="next" aria-label="Next line" title="Next line (→)"></button>
        <button type="button" data-action="finish" aria-label="Skip to verdict" title="Skip to verdict (Shift + →)"></button>
        <div class="player-progress" id="progress" role="progressbar" aria-label="Episode progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <i id="progress-fill"></i>
        </div>
        <div class="player-speed" id="speed" role="group" aria-label="Playback speed"></div>
        <button type="button" data-action="voice" aria-pressed="false" aria-label="Turn voices on" title="Browser voices" hidden></button>
        <button type="button" data-action="exit" aria-label="Lobby" title="Back to the lobby"></button>
      </div>
    </main>

    <dialog class="end-card" id="verdict" aria-labelledby="verdict-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <p class="sr-only" id="announcer" aria-live="polite"></p>
    <ol class="sr-only" id="transcript" aria-label="Transcript"></ol>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
